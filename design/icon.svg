<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- ZwinMD app icon: a mustard tile with a bold Z, on the macOS icon grid
       (an 824 point tile centred in a 1024 point canvas). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2D261"/>
      <stop offset="0.55" stop-color="#E1AD01"/>
      <stop offset="1" stop-color="#C29300"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
    <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="#735600" stroke-opacity="0.25" stroke-width="6"/>
  </g>
  <!-- The Z: two bars and a diagonal, with softened corners. -->
  <path d="M308 296H716V374L448 642H716V728H308V650L576 382H308Z"
        fill="#1E1D1A" stroke="#1E1D1A" stroke-width="20" stroke-linejoin="round"/>
</svg>

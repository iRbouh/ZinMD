# Publishes the website. The folder `site` is the whole of it: plain files,
# nothing to build. It goes to GitHub Pages whenever it changes on master.
name: Website

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One at a time, and a publish that has started is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: publish
        uses: actions/deploy-pages@v5
